name: Release Pub

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: true
      version:
        description: 'Version (e.g. 0.1.0-preview.1; leave empty to auto-increment from latest release)'
        required: false
      dry_run_cleanup:
        description: 'Preview CDN cleanup without deleting (dry run)'
        type: boolean
        required: false
        default: false
      launcher_updated:
        description: 'Launcher changed this release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 与 release-draft.yml 共用同一个 group：两个 workflow 都会读"上一个 release"来算版本号，
# 必须互相串行，否则 draft 和 pub 前后脚触发时可能算出同一个版本号撞车
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  build:
    uses: ./.github/workflows/build.yml
    with:
      prerelease: ${{ inputs.prerelease }}
      version: ${{ inputs.version }}
      dry_run_cleanup: ${{ inputs.dry_run_cleanup }}
      launcher_updated: ${{ inputs.launcher_updated }}
    secrets: inherit

  release:
    needs: build
    runs-on: windows-2025-vs2026
    steps:
      - name: Download x64
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.build.outputs.vl }}-win-x64
          path: x64
      - name: Download arm64
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.build.outputs.vl }}-win-arm64
          path: arm64

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.vl }}
          name: ${{ needs.build.outputs.v }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            x64/Starshot-${{ needs.build.outputs.vl }}-win-x64.zip
            arm64/Starshot-${{ needs.build.outputs.vl }}-win-arm64.zip
            x64/Starshot-installer-win-x64.exe
            arm64/Starshot-installer-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
