name: Release Draft

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false
      version:
        description: 'Version (e.g. 0.1.0; leave empty to auto-increment from latest stable release)'
        required: false
      dry_run_cleanup:
        description: 'Preview CDN cleanup without deleting (dry run)'
        type: boolean
        required: false
        default: false
      launcher_updated:
        description: 'Launcher changed this release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 同名 group 串行执行，避免两次手动 dispatch 同时读到同一个"上一个 release"
# 算出相同版本号，撞车创建同名 tag。不 cancel-in-progress：新的排队等，不打断正在跑的构建
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  build:
    uses: ./.github/workflows/build.yml
    with:
      prerelease: ${{ inputs.prerelease }}
      version: ${{ inputs.version }}
      dry_run_cleanup: ${{ inputs.dry_run_cleanup }}
      launcher_updated: ${{ inputs.launcher_updated }}
    secrets: inherit

  release:
    needs: build
    runs-on: windows-2025-vs2026
    steps:
      - name: Download x64
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.build.outputs.vl }}-win-x64
          path: x64
      - name: Download arm64
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.build.outputs.vl }}-win-arm64
          path: arm64

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.vl }}
          name: ${{ needs.build.outputs.v }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            x64/Starshot-${{ needs.build.outputs.vl }}-win-x64.zip
            arm64/Starshot-${{ needs.build.outputs.vl }}-win-arm64.zip
            x64/Starshot-installer-win-x64.exe
            arm64/Starshot-installer-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
