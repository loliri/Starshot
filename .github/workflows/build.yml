name: Build

# 可复用构建 workflow：解析版本 + 双架构构建 + 生成差分 + 上传 CDN。
# 由 release-draft.yml / release-pub.yml 调用，调用方各自做 release（草稿/正式）。
#
# 版本解析（resolve-version）合并在本文件内部，且是独立、非 matrix 的 job：
# build job 是 matrix: [x64, arm64]，两个架构并行跑；版本号只应该算一次，
# 放进单独 job 里用 needs 让两边消费同一个结果，避免各自读一次 GitHub API 可能读到不同状态。

on:
  workflow_call:
    inputs:
      prerelease:
        description: '本次是否预发布（决定版本号怎么算、根 manifest 更新 latest 还是 latestPreview）'
        type: boolean
        required: true
      version:
        description: '手动指定的版本号，留空则从最新 release 自动递增'
        type: string
        required: false
      dry_run_cleanup:
        description: '清理旧版本时只打印会删什么，不真的删除'
        type: boolean
        required: false
        default: false
      launcher_updated:
        description: '这次 launcher 有实质更新，把新 launcher 整个传给增量更新用户（不 diff，直接整份传，客户端整体替换）'
        type: boolean
        required: false
        default: false
    outputs:
      v:
        description: '显示版本（原大小写）'
        value: ${{ jobs.resolve-version.outputs.v }}
      vl:
        description: '小写版本号（tag/目录名）'
        value: ${{ jobs.resolve-version.outputs.vl }}

permissions:
  contents: read

jobs:

  resolve-version:
    runs-on: windows-2025-vs2026
    outputs:
      v: ${{ steps.ver.outputs.v }}
      vl: ${{ steps.ver.outputs.vl }}
    steps:
      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isPre = "${{ inputs.prerelease }}" -eq "true"
          $input = "${{ inputs.version }}".Trim()
          if ([string]::IsNullOrEmpty($input)) {
            # 显式排除 draft，不依赖 /releases 端点在不同 token 权限下的隐含默认行为
            $latestTag = (gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.draft == false)] | .[0].tag_name // empty' 2>$null)
            if ([string]::IsNullOrEmpty($latestTag)) {
              $input = if ($isPre) { "0.0.1-preview.0" } else { "0.1.0" }
              Write-Host "No usable release found, fallback to $input"
            } elseif ($isPre) {
              # 预览开关打开：上个正式 a.b.c -> a.b.(c+1)-preview.0；上个预览 a.b.c-preview.N -> a.b.c-preview.(N+1)
              $input = (npx --yes semver -i prerelease --preid preview $latestTag 2>$null)
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($input)) {
                Write-Error "semver 无法解析上一个 release 的 tag: '$latestTag'，请检查历史 tag 格式或手动指定 version"
                exit 1
              }
              Write-Host "prerelease: prev release $latestTag -> $input"
            } else {
              # 正式版：-i patch 对带 prerelease 的版本是"转正不进位"（1.2.4-preview.3 -> 1.2.4）
              # 对纯正式版是正常 +1（1.2.3 -> 1.2.4），两种情况同一条命令处理
              $input = (npx --yes semver -i patch $latestTag 2>$null)
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($input)) {
                Write-Error "semver 无法解析上一个 release 的 tag: '$latestTag'，请检查历史 tag 格式或手动指定 version"
                exit 1
              }
              Write-Host "stable: prev release $latestTag -> $input"
            }
          } else {
            # 手动指定版本：交给 semver 校验合法性，格式不对直接失败，不静默兜底成一个错误的低版本号
            $normalized = $input.Replace(' ', '-')
            npx --yes semver $normalized > $null 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "输入的版本号 '$input' 不是合法的 semver 格式"
              exit 1
            }
            $input = $normalized
          }
          $v = $input
          $vl = $v.ToLowerInvariant()
          "v=$v" >> $env:GITHUB_OUTPUT
          "vl=$vl" >> $env:GITHUB_OUTPUT

  build:
    needs: resolve-version
    strategy:
      matrix:
        platform: [x64, arm64]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build launcher
        run: msbuild src/Starshot.Launcher/Starshot.Launcher.vcxproj -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Publish main app
        run: dotnet publish src/Starshot/Starshot.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }} -p:Version=${{ needs.resolve-version.outputs.v }}

      - name: Remove unuse
        run: |
          Remove-Item -Force build/release/app/RestartAgent.exe, build/release/app/DirectML.dll, build/release/app/onnxruntime.dll, build/release/app/onnxruntime_providers_shared.dll, build/release/app/Microsoft.ML.OnnxRuntime.dll, build/release/app/VP9DecoderMFT.dll, build/release/app/avifdec.exe, build/release/app/djxl.exe, build/release/app/avifgainmaputil.exe, build/release/app/jxlinfo.exe -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build/release/app/NpuDetect -ErrorAction SilentlyContinue

      - name: Trim unsupported locales
        run: |
          # 从 Starshot.Language 的 Lang.{locale}.resx 读程序支持的语言（Lang.resx 是默认 en，主 dll 内无目录）
          $supported = Get-ChildItem src/Starshot.Language/Lang.*.resx | ForEach-Object {
            if ($_.Name -match '^Lang\.([a-z]{2}(-[A-Za-z0-9]+)?)\.resx$') { $Matches[1] }
          }
          Write-Host "Supported locales: $($supported -join ', ')"
          Get-ChildItem build/release/app -Directory | Where-Object {
            if ($supported -contains $_.Name -or $_.Name -eq "en-US") { return $false }
            try { [void][System.Globalization.CultureInfo]::GetCultureInfo($_.Name); return $true } catch { return $false }
          } | Remove-Item -Recurse -Force

      - name: Version layout
        run: |
          Move-Item build/release/app "build/release/app-${{ needs.resolve-version.outputs.vl }}" -Force
          "version=${{ needs.resolve-version.outputs.v }}" | Set-Content -Path build/release/version.ini -Encoding UTF8

      - name: Setup HDiffPatch tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $appDir = "build/release/app-${{ needs.resolve-version.outputs.vl }}"
          # hdiffz 永远取 windows64（跑在 x64 runner 上，跟 matrix 无关）
          $win64 = gh api repos/sisong/HDiffPatch/releases/latest --jq '.assets[] | select(.name | test("_bin_windows64\\.zip$")) | .browser_download_url'
          if ([string]::IsNullOrEmpty($win64)) { Write-Error "HDiffPatch windows64 zip not found"; exit 1 }
          Invoke-WebRequest $win64 -OutFile hdiff-win64.zip
          Expand-Archive hdiff-win64.zip -DestinationPath hdiff-tool -Force
          $hdiffExe = (Get-ChildItem hdiff-tool -Filter hdiffz.exe -Recurse | Select-Object -First 1).FullName
          Move-Item $hdiffExe hdiffz.exe -Force
          ./hdiffz.exe -v
          # hpatchz 跟 matrix 对齐（打进 release 给客户端 apply 用）
          if ("${{ matrix.platform }}" -eq "x64") {
            # 同一份 windows64 解压里取 hpatchz，不再重复下载
            $hpExe = (Get-ChildItem hdiff-tool -Filter hpatchz.exe -Recurse | Select-Object -First 1).FullName
            Move-Item $hpExe "$appDir/hpatchz.exe" -Force
            & "$appDir/hpatchz.exe" -v
          } else {
            $arm = gh api repos/sisong/HDiffPatch/releases/latest --jq '.assets[] | select(.name | test("_bin_windows_arm64\\.zip$")) | .browser_download_url'
            if ([string]::IsNullOrEmpty($arm)) { Write-Error "HDiffPatch windows_arm64 zip not found"; exit 1 }
            Invoke-WebRequest $arm -OutFile hpatch-arm64.zip
            Expand-Archive hpatch-arm64.zip -DestinationPath hpatch-tool -Force
            $hpExe = (Get-ChildItem hpatch-tool -Filter hpatchz.exe -Recurse | Select-Object -First 1).FullName
            Move-Item $hpExe "$appDir/hpatchz.exe" -Force
            if (-not (Test-Path "$appDir/hpatchz.exe")) { Write-Error "hpatchz.exe not found"; exit 1 }
            Remove-Item hpatch-arm64.zip, hpatch-tool -Recurse -Force
          }
          Remove-Item hdiff-win64.zip, hdiff-tool -Recurse -Force

      - name: Generate delta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $newTag = "${{ needs.resolve-version.outputs.vl }}"
          $arch = "${{ matrix.platform }}"
          $isPre = "${{ inputs.prerelease }}" -eq "true"

          # 读 release 历史（tag + prerelease 字段，倒序；/releases 默认不含 draft）
          # 不从版本号判断正式/预览——只认 release.prerelease 字段
          $raw = gh api repos/${{ github.repository }}/releases 2>$null
          $releases = if ($LASTEXITCODE -eq 0 -and $raw) { $raw | ConvertFrom-Json } else { $null }
          if (-not $releases) { Write-Host "No releases, skipping delta"; exit 0 }

          # 上一个 stable（prerelease=false 最近的）
          $prevStable = $releases | Where-Object { -not $_.prerelease } | Select-Object -First 1
          if (-not $prevStable) { Write-Host "No stable base release, skipping delta"; exit 0 }

          # 本级 preview：上一个 stable 之后（更新于它）的所有 prerelease
          # releases 按发布时间倒序，prevStable 的 index 之前（index 更小=更新）的就是它之后的 prerelease
          $stableIdx = [array]::IndexOf($releases, $prevStable)
          $recentPreviews = @()
          if ($stableIdx -gt 0) {
            $recentPreviews = $releases[0..($stableIdx - 1)] | Where-Object { $_.prerelease }
          }

          # 选 diff target（线性发布；不解析版本号——仅线起点 .0 一处例外）
          # stable：本级 preview + 前 5 个 stable + 当前 minor 线的 .0（如 2.1.100 → 2.1.0，卡老 patch 的用户也能走差分；已在前 5 内则不重复）
          # preview：本级 preview + 上一个 stable（1 个）
          $targetTags = [System.Collections.Generic.List[string]]::new()
          foreach ($r in $recentPreviews) {
            if ($r.tag_name -ne $newTag -and -not $targetTags.Contains($r.tag_name)) { $targetTags.Add($r.tag_name) }
          }
          if ($isPre) {
            if (-not $targetTags.Contains($prevStable.tag_name)) { $targetTags.Add($prevStable.tag_name) }
          } else {
            $releases | Where-Object { -not $_.prerelease } | Select-Object -First 5 | ForEach-Object {
              if ($_.tag_name -ne $newTag -and -not $targetTags.Contains($_.tag_name)) { $targetTags.Add($_.tag_name) }
            }
            # 线起点保底：当前 a.b.c → a.b.0。已是 .0 本身 / 已在集合 / release 不存在（线从非 0 起步）都不加
            $parts = $newTag.Split('.')
            if ($parts.Count -ge 2) {
              $lineStart = "$($parts[0]).$($parts[1]).0"
              if ($lineStart -ne $newTag -and -not $targetTags.Contains($lineStart)) {
                # 直接按 tag 查 release（不受 /releases 分页影响：.0 基线可能早已滚出第 1 页）；
                # 该端点不返回 draft，仅需再排除 prerelease（.0 只以预览存在过的线不算）
                $lsJson = gh api "repos/${{ github.repository }}/releases/tags/$lineStart" 2>$null
                if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrEmpty($lsJson)) {
                  $lsRelease = $lsJson | ConvertFrom-Json
                  if (-not $lsRelease.prerelease) {
                    $targetTags.Add($lineStart)
                    Write-Host "Line-start delta added: $lineStart -> $newTag"
                  }
                }
              }
            }
          }

          if ($targetTags.Count -eq 0) { Write-Host "No delta target, skipping"; exit 0 }
          Write-Host "Delta targets ($($targetTags.Count)): $($targetTags -join ', ')"

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $newApp = "build/release/app-$newTag"
          if (!(Test-Path $newApp)) { Write-Host "New app folder missing, skipping delta"; exit 0 }
          $newRoot = (Resolve-Path $newApp).Path

          foreach ($oldTag in $targetTags) {
            Write-Host "--- delta: $oldTag -> $newTag ($arch) ---"
            $oldZip = "old-$oldTag.zip"
            gh release download $oldTag --pattern "Starshot-${oldTag}-win-${arch}.zip" --output $oldZip --repo ${{ github.repository }} 2>$null
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $oldZip)) {
              Write-Host "Skip ${oldTag}: prev release zip not found"
              continue
            }

            $oldDir = "old-$oldTag"
            if (Test-Path $oldDir) { Remove-Item $oldDir -Recurse -Force }
            # 历史资产可能损坏/非法 zip：Expand-Archive 对此抛的是 terminating error，不包 try/catch
            # 会中断整个 step，把这次全新构建也拖下水。跟下面下载失败分支一样处理：跳过继续
            try {
              Expand-Archive $oldZip -DestinationPath $oldDir -Force
            } catch {
              Write-Host "Skip ${oldTag}: 解压失败 - $($_.Exception.Message)"
              Remove-Item $oldZip -Force -ErrorAction SilentlyContinue
              Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
              continue
            }
            Remove-Item $oldZip -Force

            $oldApp = Join-Path $oldDir "app-$oldTag"
            if (!(Test-Path $oldApp)) {
              Write-Host "Skip ${oldTag}: app folder not found in prev zip"
              Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
              continue
            }
            $oldRoot = (Resolve-Path $oldApp).Path

            # hdiffz 生成目录二进制 diff，直接输出 diff-*.patch（zstd 内置压缩，不再外包 zip 容器）
            $deltaPatch = "diff-${newTag}-from-${oldTag}-win-${arch}.patch"
            if (Test-Path $deltaPatch) { Remove-Item $deltaPatch }
            & ./hdiffz.exe -m -c-zstd-19 -D "$oldRoot" "$newRoot" "$deltaPatch"
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $deltaPatch)) {
              Write-Host "Skip ${oldTag}: hdiffz failed (exit $LASTEXITCODE)"
              Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $deltaPatch -Force -ErrorAction SilentlyContinue
              continue
            }

            Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "delta: $deltaPatch ($([math]::Round((Get-Item $deltaPatch).Length / 1MB, 2)) MB)"
          }

      - name: Copy launcher (if updated)
        if: ${{ inputs.launcher_updated }}
        run: Copy-Item build/release/Starshot.exe "launcher-${{ needs.resolve-version.outputs.vl }}-win-${{ matrix.platform }}.exe"

      - name: Zip release
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "Starshot-${{ needs.resolve-version.outputs.vl }}-win-${{ matrix.platform }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory("build/release", $zip, [System.IO.Compression.CompressionLevel]::SmallestSize, $false)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Starshot-${{ needs.resolve-version.outputs.vl }}-win-${{ matrix.platform }}
          path: |
            Starshot-${{ needs.resolve-version.outputs.vl }}-win-${{ matrix.platform }}.zip
            diff-*-win-${{ matrix.platform }}.patch
            launcher-*-win-${{ matrix.platform }}.exe


  upload-cdn:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    outputs:
      old_latest: ${{ steps.rootmanifest.outputs.old_latest }}
      old_latest_preview: ${{ steps.rootmanifest.outputs.old_latest_preview }}
      new_latest: ${{ steps.rootmanifest.outputs.new_latest }}
      new_latest_preview: ${{ steps.rootmanifest.outputs.new_latest_preview }}
    env:
      AWS_DEFAULT_REGION: auto
      VL: ${{ needs.resolve-version.outputs.vl }}
      PRE: ${{ inputs.prerelease }}
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.resolve-version.outputs.vl }}-win-x64
          path: upload/
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: Starshot-${{ needs.resolve-version.outputs.vl }}-win-arm64
          path: upload/

      - name: List files
        run: ls -la upload/

      - name: Generate version manifest
        shell: pwsh
        run: |
          $vl = "$env:VL"
          $pre = "$env:PRE" -eq "true"
          $files = Get-ChildItem upload/ -Name

          $x64Full = ($files | Where-Object { $_ -eq "Starshot-$vl-win-x64.zip" }) | Select-Object -First 1
          $arm64Full = ($files | Where-Object { $_ -eq "Starshot-$vl-win-arm64.zip" }) | Select-Object -First 1
          $x64Launcher = ($files | Where-Object { $_ -eq "launcher-$vl-win-x64.exe" }) | Select-Object -First 1
          $arm64Launcher = ($files | Where-Object { $_ -eq "launcher-$vl-win-arm64.exe" }) | Select-Object -First 1
          $x64Diffs = @(); $arm64Diffs = @()
          $esc = [regex]::Escape($vl)
          foreach ($f in $files) {
            if ($f -match "^diff-$esc-from-(.+?)-win-x64\.patch$") {
              $x64Diffs += [PSCustomObject]@{ from = $Matches[1]; file = $f }
            } elseif ($f -match "^diff-$esc-from-(.+?)-win-arm64\.patch$") {
              $arm64Diffs += [PSCustomObject]@{ from = $Matches[1]; file = $f }
            }
          }
          $manifest = [PSCustomObject]@{
            tag = $vl
            prerelease = $pre
            publishedAt = (Get-Date).ToString("o")
            x64 = [PSCustomObject]@{ full = $x64Full; diffs = $x64Diffs; launcher = $x64Launcher }
            arm64 = [PSCustomObject]@{ full = $arm64Full; diffs = $arm64Diffs; launcher = $arm64Launcher }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content upload/manifest.json
          Write-Host "--- manifest.json ---"
          Get-Content upload/manifest.json

      - name: Upload version dir to CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets not configured (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET)"
            exit 1
          fi
          # 整包 zip（application/zip）+ diff patch（octet-stream）；manifest.json 单独传（json）
          aws s3 cp upload/ "s3://$R2_BUCKET/release/$VL/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude "*" --include "*.zip" \
            --content-type "application/zip" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp upload/ "s3://$R2_BUCKET/release/$VL/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude "*" --include "diff-*.patch" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp upload/ "s3://$R2_BUCKET/release/$VL/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude "*" --include "launcher-*.exe" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "upload/manifest.json" "s3://$R2_BUCKET/release/$VL/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update root manifest (latest / latestPreview)
        id: rootmanifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # 拉根 manifest（不存在则建空）
          aws s3 cp "s3://$R2_BUCKET/manifest.json" ./root-manifest.json --endpoint-url "$R2_ENDPOINT" 2>/dev/null \
            || echo '{"latest":"","latestPreview":""}' > root-manifest.json

          OLD_LATEST=$(jq -r '.latest' root-manifest.json)
          OLD_LATEST_PREVIEW=$(jq -r '.latestPreview' root-manifest.json)

          # 正式版更新 latest，预览版更新 latestPreview
          if [ "$PRE" = "true" ]; then
            jq --arg v "$VL" '.latestPreview = $v' root-manifest.json > tmp.json && mv tmp.json root-manifest.json
          else
            jq --arg v "$VL" '.latest = $v' root-manifest.json > tmp.json && mv tmp.json root-manifest.json
          fi
          echo "--- root manifest.json ---"; cat root-manifest.json
          aws s3 cp root-manifest.json "s3://$R2_BUCKET/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"

          # 给 clean-old-versions job 用：更新前后的 latest/latestPreview 各留一代做缓冲，
          # 防止客户端刚读到旧 root manifest、正准备下载时资产就被删了
          NEW_LATEST=$(jq -r '.latest' root-manifest.json)
          NEW_LATEST_PREVIEW=$(jq -r '.latestPreview' root-manifest.json)
          {
            echo "old_latest=$OLD_LATEST"
            echo "old_latest_preview=$OLD_LATEST_PREVIEW"
            echo "new_latest=$NEW_LATEST"
            echo "new_latest_preview=$NEW_LATEST_PREVIEW"
          } >> "$GITHUB_OUTPUT"

  clean-old-versions:
    needs: upload-cdn
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DRY_RUN: ${{ inputs.dry_run_cleanup }}
      OLD_LATEST: ${{ needs.upload-cdn.outputs.old_latest }}
      OLD_LATEST_PREVIEW: ${{ needs.upload-cdn.outputs.old_latest_preview }}
      NEW_LATEST: ${{ needs.upload-cdn.outputs.new_latest }}
      NEW_LATEST_PREVIEW: ${{ needs.upload-cdn.outputs.new_latest_preview }}
    steps:
      - name: Clean old versions
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets not configured (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET)"
            exit 1
          fi

          # 客户端只会读根 manifest 的 latest/latestPreview 指向的那个版本自己的文件夹
          # （full 包、diff 包、manifest 全在里面），不会碰旧版本自己的文件夹。
          # 所以保留集合就是这次更新前后的 latest/latestPreview——更新前的也留一代，
          # 防止客户端刚读到旧根 manifest、正准备下载时资产就被删了。
          KEEP=$(jq -cn \
            --arg a "$OLD_LATEST" --arg b "$OLD_LATEST_PREVIEW" \
            --arg c "$NEW_LATEST" --arg d "$NEW_LATEST_PREVIEW" \
            '[$a,$b,$c,$d] | map(select(. != "")) | unique')

          COUNT=$(echo "$KEEP" | jq 'length')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::保留列表为空，为安全起见中止清理，不删除任何东西"
            exit 1
          fi
          echo "本次保留 ($COUNT 个): $(echo "$KEEP" | jq -r 'join(", ")')"

          EXISTING=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT" \
            --prefix "release/" \
            --delimiter "/" \
            --query "CommonPrefixes[].Prefix" \
            --output json 2>/dev/null | jq -r '.[]? | sub("^release/"; "") | sub("/$"; "")')

          if [ -z "$EXISTING" ]; then
            echo "release/ 下没有任何版本目录，无需清理"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "=== dry run：只预览，不会真的删除 ==="
          fi

          for tag in $EXISTING; do
            IS_KEEP=$(echo "$KEEP" | jq --arg t "$tag" 'any(. == $t)')
            if [ "$IS_KEEP" = "true" ]; then
              echo "保留: $tag"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] 会删除: $tag"
            else
              echo "删除: $tag"
              aws s3 rm "s3://$R2_BUCKET/release/$tag/" --recursive --endpoint-url "$R2_ENDPOINT"
            fi
          done
